[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zti-r6-demo"
version = "0.3.0"
description = "Separate harmless consumer of the experimental ZTI-MCP R6 ToolSpec API"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["zti-mcp-r6==0.3.0", "mcp==2.3.0", "mcp-types==2.3.0", "pydantic==2.14.2", "cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
