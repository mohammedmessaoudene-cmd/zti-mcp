name: Reproduce local reference evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify package and preserved inputs
        run: python -I scripts/verify_handoff.py
      - name: Install the declared dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Reproduce forty scenarios and three mutant witnesses
        run: python -I reference/run_r4.py --output-dir work/ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the public signed examples
        run: python -I reference/verify_examples.py --output work/examples-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Check the fresh aggregate and unchanged package
        run: python -I scripts/verify_handoff.py --summary work/ci-${{ github.run_id }}-${{ github.run_attempt }}/SUMMARY.json
