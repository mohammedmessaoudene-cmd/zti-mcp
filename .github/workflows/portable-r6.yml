name: Qualify portable R6 from the same distributions

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build one exact R6 distribution set
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the actual source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Build the distribution set after exact source verification
        run: python -I scripts/reproduce_r6.py --mode build --output-dir work/build
      - name: Upload the same immutable distributions for both operating systems
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-r6-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/build/distributions/*.whl
            work/build/distributions/*.tgz
            work/build/distributions/BUILD.json
          if-no-files-found: error
          retention-days: 7
      - name: Export safe build receipts even on failure
        if: always()
        run: python -I successor/r6/package_evidence.py --run-dir work/build --output-dir work/build-export
      - name: Retain safe build receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-r6-build-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/build-export/
          if-no-files-found: error
          retention-days: 7

  qualify:
    name: Qualify same R6 bytes (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the actual source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Download this workflow run's single build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: portable-r6-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/distset
      - name: Execute and audit installed applications from those exact bytes
        run: python -I scripts/reproduce_r6.py --mode live --distributions work/distset --output-dir work/r6
      - name: Export complete safe portable data, including retained failures
        if: always()
        run: python -I successor/r6/package_evidence.py --run-dir work/r6 --distributions work/distset --output-dir work/r6-export
      - name: Reaudit the exported archive using trusted code and data only
        run: python -I scripts/reproduce_r6.py --mode audit --evidence work/r6-export/R6_PUBLIC_EVIDENCE.zip --output-dir work/r6-audit
      - name: Export safe data-only audit receipts
        if: always()
        run: python -I successor/r6/package_evidence.py --run-dir work/r6-audit --output-dir work/r6-audit-export
      - name: Retain only safe portable evidence and source receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-r6-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/r6-export/
            work/r6-audit-export/
          if-no-files-found: error
          retention-days: 7
